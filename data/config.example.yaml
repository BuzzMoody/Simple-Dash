header: "Simple Dash"
description: "A simple homelab dashboard"
header_colors: ["#38bdf8", "#a855f7"]
# Note: The footer supports standard Markdown links `[text](url)`. HTML entities (like &copy;) are NOT fully supported; use raw unicode characters (like ©) instead.
footer: "© 2026 Buzz Moody • [GitHub](https://github.com/BuzzMoody) • Built with ☕ and Go"
favicon: "favicon.svg"
new_tabs: true
show_only_down: false
show_ping: true
show_sys_metrics: true
show_weather: false
weather_animate: true
# weather_coords: "-37.81826872134725, 144.96705907138596"
# github_token: "ghp_xxxxxxxxxxxxxxxxxxxxxx"
category_colors:
  enabled: false
  titles: false

announcements:
  - text: "Welcome to your new dashboard!"
    type: "success"

buttons:
  - name: "Router"
    url: "http://192.168.1.1"
    icon: "🌐"

widgets:
  - name: "Host System"
    type: "sys_metrics"
    icon: "💻"

  - name: "Pi-hole Stats"
    type: "pihole"
    logo: "pi-hole.svg"
    url: "http://192.168.1.10/admin/api.php"
    auth:
      key: "your_secret_api_key_here"

services:
  - name: "Pi-Hole"
    url: "http://192.168.1.10/admin"
    category: "Infrastructure"
    logo: "pi-hole.svg"
    description: "Network-wide Ad Blocking"
    widget:
      type: "pihole"
      url: "http://192.168.1.10/admin/api.php"
      auth:
        key: "your_secret_api_key_here"

  - name: "Example Service"
    url: "http://192.168.1.100"
    category: "Infrastructure"
    logo: "example.svg"
    description: "An example service description."

  - name: "Portainer"
    url: "https://docker.example.com"
    category: "Infrastructure"
    logo: "portainer.svg"
    description: "Docker Management"

  - name: "Plex"
    url: "http://10.0.0.5:32400"
    category: "Media"
    logo: "plex.svg"
    icon: "🍿"
    description: "Main media streaming server"
    pinned: true
